name: CI

# Phase 3 of the 2026-08-20 security audit. Before this there was no CI at all:
# no build check, no linter anyone read, and no test suite, which is finding S1.
#
# Four gates, cheapest first:
#
#   checks    the migration rules, the linter, the frontend and edge-function
#             types, and the two unit suites (edge-function shared code,
#             frontend logic)
#   build     the app compiles
#   security  the suite in tests/security, against the deployed project
#
# Every job installs from bun.lock with --frozen-lockfile, because bun.lock is
# what Lovable builds the live site from. Until 2026-10-07 CI ran `npm ci` on a
# package-lock.json that Lovable never reads: 28 of the 96 direct dependencies
# resolved to different versions in the two files (supabase-js 2.86.2 here,
# 2.112.3 in production), so a green build vouched for code nobody shipped.
# package-lock.json is gone, and a bun.lock that no longer matches package.json
# now fails the install step instead of drifting for weeks.
#
# The security suite talks to the real project, so it needs credentials and it
# is skipped where they are not available, which includes every pull request
# from a fork. That is a deliberate limit, not an oversight: those tests move a
# real account's credit balance and put it back, and a fork must not be able to
# do that.
#
# The credentials here are project-scoped on purpose. SUPABASE_ACCESS_TOKEN,
# which the Management API needs, is scoped to the whole Supabase ACCOUNT, and
# this repository is public: its CI must not hold a credential that reaches
# every project Michael owns. The handful of tests that genuinely need it skip
# here and run on a developer machine after `. scripts/secrets.sh`. Everything
# else runs on the service role key, which reaches this project and nothing
# else.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The security suite writes to the live project and puts things back. Two runs
# doing that at once would read each other's half-finished state, so runs are
# serialised rather than cancelled: cancelling one mid-flight is exactly how the
# test account ends up without an allowance period.
concurrency:
  group: querino-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pinned to the version that wrote bun.lock. Raising it is a deliberate
      # change, made together with the lockfile it writes.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install exactly what Lovable builds
        run: bun install --frozen-lockfile

      - name: Migrations declare their security
        # Fails when a migration adds a SECURITY DEFINER function without
        # SET search_path, a table without row-level security, or a view
        # without security_invoker, or takes any of them away again with an
        # ALTER.
        run: node scripts/check-migrations.mjs

      - name: Lint, and the `any` count has not risen
        run: node scripts/lint-ratchet.mjs

      # The frontend was never type-checked here until 2026-10-07: the build
      # strips types without reading them, so a wrong prop type or a call to a
      # function that no longer exists went out green. The tsconfig is loose
      # (no strict null checks, implicit any allowed), and it passes today, so
      # this holds the line rather than raising it.
      - name: Frontend types
        run: npx tsc --noEmit -p tsconfig.json

      # No setup-deno step: Deno is a pinned devDependency, so the install above
      # already provided it. One less action, one less version to drift.
      - name: Edge function types have not got worse
        run: node scripts/deno-check.mjs

      # Written on every audit and never run here until 2026-09-30: the unit tests
      # of the edge functions' shared code, and of the frontend's pure logic.
      - name: Unit tests, edge functions
        run: bun run test:unit

      - name: Unit tests, frontend logic
        run: bun run test:web

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build

  security:
    name: Security suite
    runs-on: ubuntu-latest
    needs: [checks, build]
    # A run waits at most 15 minutes for another run's lock and must finish
    # within 20 of taking it, because global-setup treats an older lock as
    # abandoned and a second run would then start beside this one. Past that
    # the job is hung, not slow, and GitHub's default limit is six hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Are the credentials here?
        id: creds
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUERINO_TEST_EMAIL: ${{ secrets.QUERINO_TEST_EMAIL }}
          QUERINO_TEST_PASSWORD: ${{ secrets.QUERINO_TEST_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$QUERINO_TEST_EMAIL" ] && [ -n "$QUERINO_TEST_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The security suite needs SUPABASE_SERVICE_ROLE_KEY, QUERINO_TEST_EMAIL and QUERINO_TEST_PASSWORD as repository secrets. It was skipped."
          fi

      - name: Run it
        if: steps.creds.outputs.available == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUERINO_TEST_EMAIL: ${{ secrets.QUERINO_TEST_EMAIL }}
          QUERINO_TEST_PASSWORD: ${{ secrets.QUERINO_TEST_PASSWORD }}
          INTERNAL_JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
          QUERINO_PROJECT_REF: ${{ vars.QUERINO_PROJECT_REF || 'zvuwkffneqxqsihlnfsd' }}
        run: bun run test

      - name: Keep the report
        if: always() && steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: security-suite-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
