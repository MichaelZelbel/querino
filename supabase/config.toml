[api]
enabled = true

# ── verify_jwt ───────────────────────────────────────────────────────────────
#
# READ THIS BEFORE CHANGING ONE OF THESE.
#
# verify_jwt = true makes the Supabase gateway reject a request that carries no
# Authorization header, or one whose bearer is not a valid project JWT, before
# it reaches the function. It does NOT stop the public: the anon key IS a valid
# project JWT and it ships inside every visitor's browser bundle. So this flag
# is a floor, never the guard. Every function below still has to work out who
# is calling it, and the ones that spend money or read private rows do.
#
# Until 2026-08-21 this file listed 29 functions while production ran 35, and
# every one of the 35 was verify_jwt = false, including six the file never
# mentioned. A config that describes two thirds of reality is worse than none,
# because it reads like a decision. So all 35 are listed, each with its reason.
#
# The two questions that decide the flag:
#   1. Does every legitimate caller send an Authorization header? If any does
#      not, this must be false or that caller gets a 401 it cannot fix.
#   2. Is the header a Supabase JWT? An MCP token is not, and neither is
#      nothing at all.

# ── Machine endpoints: pg_cron calls these with X-Internal-Key and no bearer ──
# The real guard is _shared/internalAuth.ts. verify_jwt must stay false or the
# scheduled jobs 401 at the gateway before the guard ever runs.

[functions.github-sync-worker]
verify_jwt = false  # pg_cron every 30s, X-Internal-Key only

[functions.ai-moderate-content]
verify_jwt = false  # pg_cron every 2min, X-Internal-Key only; admins may also trigger it by hand

[functions.process-menerio-sync-queue]
verify_jwt = false  # pg_cron every 1min, X-Internal-Key only

[functions.ensure-token-allowance]
verify_jwt = false  # batch_init is reachable by a keyless machine caller holding X-Internal-Key

# ── Public by design: the caller is a stranger and that is the point ──────────

[functions.api]
verify_jwt = false  # serves /rss.xml and /sitemap.xml; feed readers and crawlers send no headers

[functions.blog-api]
verify_jwt = false  # public blog REST for external clients

[functions.mcp-server]
verify_jwt = false  # MCP clients send `Bearer qrn_mcp_…`, which is not a Supabase JWT; true breaks every client

# ── Caller not established, so left as found ─────────────────────────────────
# Nothing in src/ or supabase/ calls these by name. That means either an
# external caller nobody wrote down, or dead code. Tightening the gateway on a
# caller you cannot name is how you find out who it was, in production. Find
# the caller, then decide.

[functions.canvas-ai]
verify_jwt = false  # TODO: no caller found in this repository

[functions.create-checkout]
verify_jwt = false  # TODO: no caller found in this repository (Stripe flow)

[functions.customer-portal]
verify_jwt = false  # TODO: no caller found in this repository (Stripe flow)

[functions.fetch-skill-md]
verify_jwt = false  # TODO: no caller found in this repository

# ── Everything else: every caller sends a Supabase JWT ───────────────────────
# Called from the browser through supabase.functions.invoke, which always sends
# one, or from a database trigger holding the service-role key. Each still
# derives the user from the JWT itself; this flag only turns away callers who
# bring nothing at all.

[functions.ai-insights]
verify_jwt = true

[functions.backfill-embeddings]
verify_jwt = true

[functions.check-subscription]
